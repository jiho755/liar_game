/* 앱(APK)에서 열렸을 때: 인터넷이 되면 GitHub Pages의 최신 버전으로 이동, 안 되면 앱에 들어있는 버전으로 실행 */
(function(){
  var REMOTE='https://jiho755.github.io/liar_game/';
  if(location.hostname!=='localhost')return;
  var de=document.documentElement;de.style.background='#6F9650';de.style.visibility='hidden';
  var done=false;function show(){if(done)return;done=true;de.style.visibility='';}
  var ctl=window.AbortController?new AbortController():null;
  var timer=setTimeout(function(){if(ctl)ctl.abort();show();},2500);
  try{
    fetch(REMOTE+'index.html?check='+Date.now(),{cache:'no-store',signal:ctl?ctl.signal:undefined})
      .then(function(r){if(r.ok&&!done){done=true;clearTimeout(timer);location.replace(REMOTE+'?v='+Date.now());}else{show();}})
      .catch(show);
  }catch(e){show();}
})();
</script>

<button id="sndbtn" type="button" aria-label="소리 켜기/끄기" aria-pressed="true"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#FFF9EC"/><g class="w" fill="none" stroke="#FFF9EC" stroke-width="1.9" stroke-linecap="round"><path d="M15.5 9.2a4.2 4.2 0 0 1 0 5.6"/><path d="M18 6.8a7.6 7.6 0 0 1 0 10.4"/></g><g class="x" fill="none" stroke="#FFF9EC" stroke-width="1.9" stroke-linecap="round"><path d="M16 9.5l5 5M21 9.5l-5 5"/></g></svg></button>
<script>
/* 소리: Web Audio API로만 생성 (오디오 파일/외부 요청 없음) */
(function(){
'use strict';
var KEY='liarSound',BPM=72,EIGHTH=60/BPM/2,AHEAD=0.2,TICK=25,MASTER=0.8,noop=function(){};
var ctx=null,G=null,muted=false,sceneName='landing',curTarget=null,timer=0,stopTO=0,step=0,origin=0,hidTO=0;
try{muted=localStorage.getItem(KEY)==='off';}catch(e){}

var mtof=function(m){return 440*Math.pow(2,(m-69)/12);};
function hash(a,b,c){var h=Math.imul(a+1,374761393)^Math.imul(b+7,668265263)^Math.imul(c+13,1274126177);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}

/* ---------- 그래프: (bus)->master->compressor->out. ctx는 실시간/오프라인 모두 가능 ---------- */
function makeImpulse(c,secs,decay){
  var sr=c.sampleRate,len=Math.floor(sr*secs),buf=c.createBuffer(2,len,sr),seed=12345;
  for(var ch=0;ch<2;ch++){var d=buf.getChannelData(ch),lp=0;
    for(var i=0;i<len;i++){seed=(seed*1664525+1013904223)>>>0;var n=seed/2147483648-1;lp+=(n-lp)*0.3;
      d[i]=lp*Math.pow(1-i/len,decay)*(i<sr*0.012?i/(sr*0.012):1);}
  }
  return buf;
}
function buildGraph(c){
  var g={};
  g.master=c.createGain();g.master.gain.value=MASTER;
  g.comp=c.createDynamicsCompressor();
  g.comp.threshold.value=-16;g.comp.knee.value=12;g.comp.ratio.value=6;g.comp.attack.value=0.004;g.comp.release.value=0.2;
  g.master.connect(g.comp);g.comp.connect(c.destination);
  var imp=makeImpulse(c,1.6,3);
  function bus(trim){
    var b={};b.out=c.createGain();var tr=c.createGain();tr.gain.value=trim;b.out.connect(tr);tr.connect(g.master);
    b.dry=c.createGain();b.dry.connect(b.out);
    b.send=c.createGain();b.send.gain.value=0.5;
    var cv=c.createConvolver();cv.buffer=imp;var ret=c.createGain();ret.gain.value=0.9;
    b.send.connect(cv);cv.connect(ret);ret.connect(b.out);
    return b;
  }
  g.mus=bus(0.42);g.mus.out.gain.value=0;g.music=g.mus.out;
  g.sfxb=bus(1);g.sfxb.out.gain.value=1;
  return g;
}

/* ---------- 음색 ---------- */
/* o: f,t,dur,vel,att,parts[{m,g,type,d,k}],lp */
function tone(c,bus,wet,o){
  var env=c.createGain(),t=o.t,end=t+o.dur+0.05;
  env.gain.setValueAtTime(0.0001,t);
  env.gain.exponentialRampToValueAtTime(o.vel,t+(o.att||0.004));
  env.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  o.parts.forEach(function(p){
    var osc=c.createOscillator(),pg=c.createGain();
    osc.type=p.type||'sine';osc.frequency.value=o.f*(p.m||1);osc.detune.value=p.d||0;
    pg.gain.setValueAtTime(p.g,t);
    if(p.k)pg.gain.exponentialRampToValueAtTime(0.0001,t+o.dur*p.k);
    osc.connect(pg);pg.connect(env);osc.start(t);osc.stop(end);
  });
  var out=env;
  if(o.lp){var f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;env.connect(f);out=f;}
  out.connect(bus.dry);if(wet)out.connect(bus.send);
}
function musicBox(c,bus,wet,f,t,dur,vel,sd){
  var dt=(sd-0.5)*8;
  tone(c,bus,wet,{f:f,t:t,dur:dur,vel:vel,att:0.004,parts:[
    {m:1,g:0.7,type:'sine',d:dt-3},{m:1,g:0.5,type:'sine',d:dt+4},
    {m:2,g:0.22,type:'triangle',k:0.5},{m:5.02,g:0.04,type:'sine',k:0.12}]});
}
function felt(c,bus,wet,f,t,dur,vel,sd){
  tone(c,bus,wet,{f:f,t:t,dur:dur,vel:vel,att:0.014,lp:1300,parts:[
    {m:1,g:1,type:'sine',d:(sd-0.5)*6},{m:1,g:0.35,type:'triangle',d:5,k:0.6},{m:2,g:0.08,type:'sine',k:0.25}]});
}

/* ---------- BGM: C장조 72BPM, 16마디 (I vi IV V | I iii IV V | I vi ii V | IV V I V) ---------- */
var PROG=[[0,0],[9,1],[5,0],[7,0],[0,0],[4,1],[5,0],[7,0],[0,0],[9,1],[2,1],[7,0],[5,0],[7,0],[0,0],[7,0]];
var PENT=[67,69,72,74,76,79,81,84];
var MEL=[
  [[0,76,3],[3,74,1],[4,72,4]],
  [[2,69,2],[4,72,2],[6,74,2]],
  [[0,72,3],[3,69,1],[4,72,4]],
  [[0,74,4],[4,67,4]],
  [[0,76,2],[2,79,2],[4,76,4]],
  [[0,79,3],[3,76,1],[4,74,4]],
  [[0,72,2],[2,74,2],[4,72,2],[6,69,2]],
  [[0,74,6]],
  [[0,72,2],[2,76,2],[4,79,4]],
  [[0,81,3],[3,79,1],[4,76,4]],
  [[0,74,3],[3,72,1],[4,69,4]],
  [[0,67,2],[2,74,2],[4,74,4]],
  [[0,76,2],[2,74,2],[4,72,4]],
  [[0,74,2],[2,72,2],[4,74,4]],
  [[0,72,6]],
  [[2,74,2],[4,67,4]]
];
var ARP=[[0,1,2,3,2,1,2,1],[0,2,1,3,2,3,1,2],[0,1,2,1,3,2,1,2],[0,2,3,2,1,2,3,1]];
function bgmStep(c,g,s,t){
  var bar=Math.floor(s/8)%16,e=s%8,pass=Math.floor(s/128),ch=PROG[bar],pc=ch[0],mn=ch[1],b=g.mus;
  var bassRoot=48+pc-(pc>6?12:0),r4=60+pc-(pc>7?12:0);
  var tones=[r4,r4+(mn?3:4),r4+7,r4+12];
  if(e===0){
    felt(c,b,true,mtof(bassRoot),t,2.7,0.10,hash(pass,bar,1));
    for(var i=0;i<3;i++)felt(c,b,true,mtof(tones[i]),t+i*0.018,3.0,0.034,hash(pass,bar,2+i));
  }
  if(e===4)felt(c,b,true,mtof(bassRoot+(bar%4===3?0:7)),t,1.5,0.055,hash(pass,bar,9));
  var hv=hash(pass,bar,e);
  if(hv>0.12){
    var v=(e%4===0?0.036:0.026)*(0.85+0.3*hash(pass,bar,e+20));
    musicBox(c,b,true,mtof(tones[ARP[pass%4][e]]),t,1.1,v,hash(pass,bar,e+40));
  }
  MEL[bar].forEach(function(n){
    if(n[0]!==e)return;
    var k=hash(pass,bar,n[0]+50);
    if(pass>0&&k<0.1)return;
    var m=n[1];
    if(pass%2===1&&k>0.72){var ix=PENT.indexOf(m);if(ix>=0){ix+=(k>0.86?1:-1);if(ix>=0&&ix<PENT.length)m=PENT[ix];}}
    musicBox(c,b,true,mtof(m),t,n[2]*EIGHTH*0.9+0.7,0.085,hash(pass,bar,n[0]+60));
  });
}

/* ---------- 효과음 ---------- */
var SFX={
  tok:function(c,g,t,rate){
    var f=640*(rate||1),o=c.createOscillator(),e=c.createGain(),lp=c.createBiquadFilter();
    o.type='triangle';o.frequency.setValueAtTime(f*1.35,t);o.frequency.exponentialRampToValueAtTime(f,t+0.025);
    e.gain.setValueAtTime(0.0001,t);e.gain.exponentialRampToValueAtTime(0.26,t+0.004);e.gain.exponentialRampToValueAtTime(0.0001,t+0.065);
    lp.type='lowpass';lp.frequency.value=2600;
    o.connect(e);e.connect(lp);lp.connect(g.sfxb.dry);o.start(t);o.stop(t+0.08);
  },
  chime:function(c,g,t){
    [659.26,783.99,1046.5].forEach(function(f,i){musicBox(c,g.sfxb,true,f,t+i*0.105,0.95,0.2,0.5);});
  },
  bonk:function(c,g,t){
    var o=c.createOscillator(),o2=c.createOscillator(),e=c.createGain(),lp=c.createBiquadFilter(),g2=c.createGain();
    o.type='sine';o.frequency.setValueAtTime(215,t);o.frequency.exponentialRampToValueAtTime(98,t+0.22);
    o2.type='triangle';o2.frequency.setValueAtTime(107,t);o2.frequency.exponentialRampToValueAtTime(49,t+0.22);g2.gain.value=0.3;
    e.gain.setValueAtTime(0.0001,t);e.gain.exponentialRampToValueAtTime(0.42,t+0.007);e.gain.exponentialRampToValueAtTime(0.0001,t+0.36);
    lp.type='lowpass';lp.frequency.value=650;
    o.connect(e);o2.connect(g2);g2.connect(e);e.connect(lp);lp.connect(g.sfxb.dry);
    o.start(t);o2.start(t);o.stop(t+0.4);o2.stop(t+0.4);
  },
  bleat:function(c,g,t,rate){

    tg.gain.value=0.86;tl.gain.value=0.14;lfo.connect(tl);tl.connect(tg.gain);                /* 얕은 떨림(진폭) */

    var f2=bp(8,[[0,1100],[0.12,2000],[0.2,1800],[0.28,1750],[0.8,1400]],0.7);

    env.gain.exponentialRampToValueAtTime(0.5,t+0.15);env.gain.exponentialRampToValueAtTime(1.0,t+0.23);
    env.gain.linearRampToValueAtTime(0.85,t+0.62);env.gain.exponentialRampToValueAtTime(0.0001,t+0.86);
    var out=c.createGain();out.gain.value=0.62;

function renderOffline(kind,opts){
  opts=opts||{};
  var sr=opts.sampleRate||22050,secs=opts.seconds||DUR[kind]||2;
  var Off=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  var oc=new Off(1,Math.ceil(sr*secs),sr),g=buildGraph(oc),t0=0.05;
  g.music.gain.value=1;
  if(kind==='bgm'||kind==='mix'){for(var s=0;s*EIGHTH<secs-0.2;s++)bgmStep(oc,g,s,t0+s*EIGHTH);}
  if(kind==='mix'){
    SFX.bleat(oc,g,2.0,1);SFX.tok(oc,g,2.3,1);SFX.chime(oc,g,5.0);SFX.tok(oc,g,5.05,1);SFX.tada(oc,g,7.0);
    SFX.bonk(oc,g,9.0);SFX.tok(oc,g,9.02,1);SFX.bleat(oc,g,10.0,1);SFX.tada(oc,g,10.1);SFX.chime(oc,g,10.15);
  }else if(SFX[kind])SFX[kind](oc,g,t0,1);
  return oc.startRendering().then(function(b){return b.getChannelData(0);});
}

function ensure(){
  if(ctx)return true;
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return false;
  try{ctx=new AC();G=buildGraph(ctx);G.master.gain.value=muted?0:MASTER;}
  catch(e){try{ctx&&ctx.close();}catch(_){}ctx=null;G=null;return false;}
  return true;
}
function resume(){if(ctx&&ctx.state!=='running'&&!document.hidden){try{var p=ctx.resume();if(p&&p.catch)p.catch(noop);}catch(e){}}}
function tick(){
  if(!ctx)return;
  var now=ctx.currentTime;
  if(origin+step*EIGHTH<now-0.05)step=Math.ceil((now+0.02-origin)/EIGHTH);
  var guard=0;
  while(origin+step*EIGHTH<now+AHEAD&&guard++<16){bgmStep(ctx,G,step,origin+step*EIGHTH);step++;}
}
function startSched(){
  if(timer||!ctx||muted||document.hidden)return;
  step=Math.ceil(step/8)*8;origin=ctx.currentTime+0.08-step*EIGHTH;
  tick();timer=setInterval(tick,TICK);
}
function stopSched(){if(timer){clearInterval(timer);timer=0;}}
function levelFor(n){return n==='result'?0.5:(n==='play'||n==='guess')?0:1;}
function applyScene(){
  if(!ctx||!G||muted)return;
  var tgt=levelFor(sceneName);
  clearTimeout(stopTO);stopTO=0;
  if(tgt>0)startSched();
  if(tgt!==curTarget){
    var p=G.music.gain,now=ctx.currentTime,from=curTarget===null?0:p.value;
    curTarget=tgt;
    p.cancelScheduledValues(now);p.setValueAtTime(from,now);p.linearRampToValueAtTime(tgt,now+(tgt===0?0.6:1.2));
  }
  if(tgt===0)stopTO=setTimeout(function(){stopTO=0;if(levelFor(sceneName)===0)stopSched();},800);
}
function unlock(){
  try{
    if(muted||!ensure())return;
    resume();
    if(curTarget===null)applyScene();
  }catch(e){}
}
function scene(name){sceneName=name;try{applyScene();}catch(e){}}
function playSfx(name,rate){
  if(muted||!ctx||document.hidden)return;
  try{resume();SFX[name](ctx,G,ctx.currentTime+0.012,rate);}catch(e){}
}
function btn(){return document.getElementById('sndbtn');}
function paint(){var b=btn();if(!b)return;b.classList.toggle('off',muted);b.setAttribute('aria-pressed',muted?'false':'true');}
function setMuted(m){
  muted=!!m;
  try{localStorage.setItem(KEY,muted?'off':'on');}catch(e){}
  paint();
  try{
  if(muted){
    stopSched();clearTimeout(stopTO);stopTO=0;curTarget=null;
    if(ctx&&G){
      var now=ctx.currentTime;G.master.gain.cancelScheduledValues(now);G.master.gain.setValueAtTime(G.master.gain.value,now);G.master.gain.linearRampToValueAtTime(0,now+0.03);
      clearTimeout(hidTO);
      hidTO=setTimeout(function(){
        if(muted&&ctx){G.master.gain.cancelScheduledValues(0);G.master.gain.value=0;
          if(ctx.state==='running'){try{ctx.suspend().catch(noop);}catch(e){}}}
      },120);
    }
  }else{
    if(!ensure())return;
    clearTimeout(hidTO);
    G.master.gain.cancelScheduledValues(0);G.master.gain.value=MASTER;
    resume();applyScene();
    API.sfx.tok();
  }
  }catch(e){}
}
var API={
  start:unlock,scene:scene,setMuted:setMuted,isMuted:function(){return muted;},
  sfx:{
    tok:function(){playSfx('tok',1+(Math.random()-0.5)*0.06);},
    chime:function(){playSfx('chime',1);},
    bonk:function(){playSfx('bonk',1);},
    bleat:function(){playSfx('bleat',1);},
    tada:function(){playSfx('tada',1);}
  },
  info:function(){return {scene:sceneName,target:curTarget,gain:G?G.music.gain.value:null,master:G?G.master.gain.value:null,scheduler:!!timer,muted:muted,state:ctx?ctx.state:'none'};},
  renderOffline:renderOffline
};

/* 첫 제스처에서 컨텍스트 생성/재개 (iOS·Android WebView 자동재생 정책) + 버튼 탭 소리(이벤트 위임) */
['pointerdown','touchend','click','keydown'].forEach(function(ev){document.addEventListener(ev,function(){if(!muted&&(!ctx||ctx.state!=='running'))unlock();},true);});
document.addEventListener('click',function(e){
  var b=e.target&&e.target.closest?e.target.closest('button,[role="button"]'):null;
  if(!b||b.id==='sndbtn'||b.id==='rv'||b.classList.contains('mcbtn')||b.disabled)return;

},true);
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    stopSched();clearTimeout(stopTO);stopTO=0;
    if(ctx&&ctx.state==='running'){try{ctx.suspend().catch(noop);}catch(e){}}
  }else if(!muted&&ctx&&G){resume();curTarget=null;applyScene();}
});

paint();
})();

(function(){

const CATS=['전체',...Object.keys(WORDS)];
const app=document.getElementById('app');
let cfg={n:5,liars:1,cat:'전체',mode:'일반'};
const MODES=['일반','바보'];
const MODE_DESC={'일반':'라이어는 제시어 없이 카테고리만 알아요','바보':'라이어도 비슷한 다른 단어를 받아요. 본인이 라이어인지 몰라요'};
const maxLiars=n=>n>=10?3:n>=6?2:1;
const gridCls=()=>cfg.n>9?'grid g4':'grid';
try{const s=JSON.parse(localStorage.getItem('liarCfg')||'null');if(s&&s.n>=3&&s.n<=15){cfg={n:s.n|0,liars:Math.min(Math.max(s.liars|0,1),maxLiars(s.n)),cat:CATS.includes(s.cat)?s.cat:'전체',mode:MODES.includes(s.mode)?s.mode:'일반'};}}catch(e){}
function save(){try{localStorage.setItem('liarCfg',JSON.stringify(cfg));}catch(e){}}
const used=new Set(); // session-used words
let g=null; // game state
const rnd=n=>Math.floor(Math.random()*n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function pickWord(){
  let pool=[];
  const cats=cfg.cat==='전체'?Object.keys(WORDS):[cfg.cat];
  cats.forEach(c=>WORDS[c].forEach(([w,v])=>pool.push({w,v,c})));
  let fresh=pool.filter(x=>!used.has(x.w));
  if(!fresh.length){pool.forEach(x=>used.delete(x.w));fresh=pool;}
  const p=fresh[rnd(fresh.length)];
  used.add(p.w);
  if(cfg.mode==='바보'){const others=WORDS[p.c].filter(([w])=>w!==p.w);if(others.length)p.fool=others[rnd(others.length)][0];}
  return p;
}
function startGame(){
  const p=pickWord();
  const ids=[...Array(cfg.n).keys()];
  const liars=[];
  for(let i=0;i<cfg.liars;i++){liars.push(ids.splice(rnd(ids.length),1)[0]);}
  g={word:p.w,fool:cfg.mode==='바보'&&p.fool?p.fool:null,verse:p.v,cat:p.c,liars:liars.sort((a,b)=>a-b),i:0,first:rnd(cfg.n),sel:[],caught:false,guess:null,};
  coverScreen();
}
function set(html){app.innerHTML='<div class="screen">'+html+'</div>';window.scrollTo(0,0);}
function on(id,fn){const e=document.getElementById(id);if(e)e.onclick=fn;return e;}

}

  on('l1',()=>{cfg.liars=1;paint();});on('l2',()=>{if(cfg.n>=6){cfg.liars=2;paint();}});

  set(`${homeBtn()}
  <h2>투표</h2>
  <p class="note" style="text-align:center;margin:0;font-size:16px;word-break:keep-all">${g.first+1}번부터 한 사람씩 돌아가며 설명한 후 투표하세요.</p>
  <p class="sub" style="font-size:19px;color:var(--cream)">“하나, 둘, 셋” 하면<br>동시에 라이어를 지목하세요</p>
  <div class="card"><div class="label">가장 많은 표를 받은 사람${need>1?` (${need}명 선택)`:''}</div><div class="${gridCls()}">${btns}</div></div>
  <div class="spacer"></div>
  <button class="btn olive" id="rv" disabled>공개</button>`);
  bindHome();
  const rv=document.getElementById('rv');
  document.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,k=g.sel.indexOf(i);
    if(k>=0)g.sel.splice(k,1);
    else{if(g.sel.length>=need){if(need===1)g.sel=[];else g.sel.shift();}g.sel.push(i);}
    document.querySelectorAll('.pbtn').forEach(x=>x.className='pbtn'+(g.sel.includes(+x.dataset.i)?' on':''));
    rv.disabled=g.sel.length!==need;
  });
  rv.onclick=revealLiars;
}

/* 6. reveal */
function revealLiars(){
  A.scene('play');
  g.caught=g.liars.every(l=>g.sel.includes(l));
  const names=g.liars.map(l=>(l+1)+'번').join(', ');
  let grid='';for(let i=0;i<cfg.n;i++)grid+=`<div class="pbtn ${g.liars.includes(i)?'liar':''}" style="display:flex;align-items:center;justify-content:center">${i+1}번</div>`;
  if(g.caught){
    set(`<div class="topbar" style="min-height:44px"></div>
    <div class="banner">라이어를 찾았어요!</div>
    <div class="card center"><div class="label" style="margin:0">라이어는</div><div class="big">${names}</div></div>
    <div class="card"><div class="${gridCls()}">${grid}</div></div>
    <button class="btn" id="nx">라이어의 정답 기회</button>`);
    on('nx',guessScreen);
    A.sfx.chime();
  }else{
    set(`<div class="topbar" style="min-height:44px"></div>
    <div class="banner">라이어 승리!</div>
    <div class="card center"><div class="label" style="margin:0">${g.liars.length>1&&g.sel.some(s=>g.liars.includes(s))?'라이어를 모두 찾지 못했어요. 라이어는':'라이어는'}</div><div class="big">${names}</div></div>
    <div class="card"><div class="${gridCls()}">${grid}</div></div>
    <button class="btn" id="nx">제시어 공개</button>`);
    on('nx',()=>resultScreen('liar'));
    A.sfx.bleat();
  }
}
function guessScreen(){
  A.scene('guess');
  const pool=WORDS[g.cat].map(([w])=>w).filter(w=>w!==g.word&&w!==g.fool);
  for(let i=pool.length-1;i>0;i--){const j=rnd(i+1);[pool[i],pool[j]]=[pool[j],pool[i]];}
  const opts=[g.word,...pool.slice(0,5)];
  for(let i=opts.length-1;i>0;i--){const j=rnd(i+1);[opts[i],opts[j]]=[opts[j],opts[i]];}
  set(`<div class="topbar" style="min-height:44px"></div>
  <h2>라이어 정답 기회</h2>
  <p class="sub" style="font-size:19px;color:var(--cream);word-break:keep-all">라이어가 아래 6개 중에서 진짜 제시어를 골라 주세요</p>${g.fool?`<p class="note" style="text-align:center;margin:0;word-break:keep-all">라이어는 자기가 받은 단어(${esc(g.fool)})와 다른 진짜 제시어를 맞혀야 해요</p>`:''}
  <div class="cat" style="text-align:center;margin:18px 0 0">카테고리 · ${esc(g.cat)}</div>
  <div class="mc">${opts.map((w,i)=>`<button class="mcbtn" data-i="${i}">${esc(w)}</button>`).join('')}</div>`);
  const btns=[...document.querySelectorAll('.mcbtn')];
  btns.forEach((b,i)=>b.onclick=()=>{
    btns.forEach(x=>x.disabled=true);
    const ok=opts[i]===g.word;
    if(ok)A.sfx.chime();else A.sfx.bonk();
    if(ok){b.classList.add('right');b.textContent='✓ '+opts[i];}
    else{b.classList.add('wrong');b.textContent='✗ '+opts[i];
      const k=opts.indexOf(g.word);btns[k].classList.add('right');btns[k].textContent='✓ '+opts[k];}
    setTimeout(()=>ok?resultScreen('liar',true):resultScreen('citizen'),1200);
  });
}

/* 7. result */
function resultScreen(winner,guessed){
  A.scene('result');
  if(winner==='citizen')A.sfx.tada();else if(guessed)A.sfx.bleat();
  const msg=winner==='citizen'?'시민 승리!':(guessed?'라이어 승리! (제시어를 맞혔어요)':'라이어 승리!');
  set(`<div class="topbar" style="min-height:44px"></div>
  <div class="bwrap">${sheepSVG(winner!=='citizen')}<div class="banner">${msg}</div></div>
  <div class="card center">
    ${g.fool?`<div class="cat">카테고리 · ${esc(g.cat)}</div>
    <div class="label" style="margin:0">시민 제시어</div>
    <div class="big" style="font-size:36px;word-break:keep-all">${esc(g.word)}</div>
    <div class="cat" style="font-weight:500">라이어 제시어: ${esc(g.fool)}</div>`:`<div class="label" style="margin:0">제시어</div>
    <div class="cat">카테고리 · ${esc(g.cat)}</div>
    <div class="big" style="font-size:40px">${esc(g.word)}</div>`}  </div>
  <button class="btn olive" id="again">같은 설정으로 다시</button>
  <button class="btn ghost" id="cfgb">설정 바꾸기</button>`);
  on('again',startGame);on('cfgb',setupScreen);
}



/* static themed background (rendered once) + static sheep for result banner */
function buildBg(){
  const NS='http://www.w3.org/2000/svg';
  const sv=document.createElementNS(NS,'svg');sv.setAttribute('viewBox','0 0 300 520');sv.setAttribute('preserveAspectRatio','xMidYMax slice');
  let sd=5;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  let h='';
  for(let i=0;i<70;i++){const x=r()*300,y=r()*520,c=r()<.6?'#5E8442':'#86A964';h+=`<path d="M${x-3} ${y} L${x} ${y+5} L${x+3} ${y}" stroke="${c}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`}
  for(let i=0;i<40;i++){h+=`<circle cx="${r()*300}" cy="${r()*520}" r="${6+r()*14}" fill="${r()<.5?'#739A54':'#6A914C'}" opacity=".6"/>`}
  sv.innerHTML=h;document.getElementById('bg').appendChild(sv);
}
function sheepSVG(black){
  const W=black?{f:'#2B2A28',s:'#171615',c:'#45423E'}:{f:'#F3EDDF',s:'#D6CAB0',c:'#D9CDB4'};
  let sd=11;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  let h='<ellipse cx="0" cy="30" rx="30" ry="4" fill="#5A7E40" opacity=".5"/>';
  [-18,-8,10,20].forEach(x=>h+=`<rect x="${x-1.6}" y="12" width="3.2" height="18" rx="1.4" fill="#2B2A28"/>`);
  for(let a=0;a<360;a+=24){const rad=a*Math.PI/180;h+=`<circle cx="${Math.cos(rad)*30}" cy="${Math.sin(rad)*18}" r="8" fill="${W.f}" stroke="${W.s}" stroke-width="1.3"/>`}
  h+=`<ellipse cx="0" cy="0" rx="31" ry="19" fill="${W.f}"/>`;
  for(let i=0;i<14;i++){const x=-24+r()*48,y=-12+r()*24;h+=`<path d="M${x} ${y} a2.4 2.4 0 1 1 3 2" stroke="${W.c}" stroke-width="1" fill="none"/>`}
  h+=`<g transform="translate(26 -10)"><ellipse cx="4" cy="-5" rx="5" ry="3" fill="#D9B49A" transform="rotate(-25 4 -5)"/><ellipse cx="13" cy="0" rx="11" ry="7.5" fill="#F1E2D0"/><circle cx="5" cy="-6" r="5" fill="${W.f}" stroke="${W.s}" stroke-width="1"/><circle cx="15" cy="-2" r="1.5" fill="#2B2A28"/><path d="M21.5 2.5 q1.5 1.2 0 2.4" stroke="#2B2A28" stroke-width="1" fill="none"/></g>`;
  return `<svg class="bsheep" viewBox="-40 -28 94 64" aria-hidden="true" focusable="false">${h}</svg>`;
}

/* 0. landing (shown only at app open) */
let landingEl=null,raf=0;
function leaveLanding(){
  if(raf){cancelAnimationFrame(raf);raf=0;}
  if(landingEl){landingEl.remove();landingEl=null;}
}
function landingScreen(){
  A.scene('landing');
  const NS='http://www.w3.org/2000/svg';
  landingEl=document.createElement('div');landingEl.id='landing';
  landingEl.innerHTML='<svg id="lsv" viewBox="0 0 300 520" preserveAspectRatio="xMidYMax slice" role="img" aria-label="풀밭의 양 떼 애니메이션"></svg><div class="lt"><div class="lt1">성경 라이어</div><div class="lt2">우리 중에 검은 양이 있다</div></div><button class="lb" id="lstart">게임 시작</button>';
  document.body.appendChild(landingEl);
  const sv=landingEl.querySelector('#lsv');
  let sd=5;const r=()=>(sd=(sd*16807)%2147483647)/2147483647;
  const el=(tag,at,p)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);(p||sv).appendChild(e);return e};
  const bgG=el('g',{});
  const sg=el('g',{transform:'translate(0 -158)',class:'lsheep'});

for(let i=0;i<70;i++){const x=r()*300,y=r()*520,c=r()<.6?'#5E8442':'#86A964';el('path',{d:`M${x-3} ${y} L${x} ${y+5} L${x+3} ${y}`,stroke:c,'stroke-width':1.3,fill:'none','stroke-linecap':'round'},bgG)}
for(let i=0;i<40;i++){el('circle',{cx:r()*300,cy:r()*520,r:6+r()*14,fill:r()<.5?'#739A54':'#6A914C',opacity:.6},bgG)}
function sheep(cx,cy,sc,dir,black){
 const W=black?{f:'#2B2A28',s:'#171615',c:'#45423E'}:{f:'#F3EDDF',s:'#D6CAB0',c:'#D9CDB4'};
 const root=el('g',{transform:`translate(${cx} ${cy}) scale(${sc*dir} ${sc})`},sg);
 el('ellipse',{cx:0,cy:30,rx:30,ry:4,fill:'#5A7E40',opacity:.5},root);
 [-18,-8,10,20].forEach(x=>el('rect',{x:x-1.6,y:12,width:3.2,height:18,rx:1.4,fill:'#2B2A28'},root));
 const pts=[];for(let a=0;a<360;a+=24){const rad=a*Math.PI/180;pts.push([Math.cos(rad)*30,Math.sin(rad)*18])}
 pts.forEach(p=>el('circle',{cx:p[0],cy:p[1],r:8,fill:W.f,stroke:W.s,'stroke-width':1.3},root));
 el('ellipse',{cx:0,cy:0,rx:31,ry:19,fill:W.f},root);
 for(let i=0;i<14;i++){const x=-24+r()*48,y=-12+r()*24;el('path',{d:`M${x} ${y} a2.4 2.4 0 1 1 3 2`,stroke:W.c,'stroke-width':1,fill:'none'},root)}
 const pivot=el('g',{transform:'translate(26 -10)'},root);
 const head=el('g',{},pivot);
 const side=el('g',{},head);
 el('ellipse',{cx:4,cy:-5,rx:5,ry:3,fill:'#D9B49A',transform:'rotate(-25 4 -5)'},side);
 el('ellipse',{cx:13,cy:0,rx:11,ry:7.5,fill:'#F1E2D0'},side);
 el('circle',{cx:5,cy:-6,r:5,fill:W.f,stroke:W.s,'stroke-width':1},side);
 el('circle',{cx:15,cy:-2,r:1.5,fill:'#2B2A28'},side);
 el('path',{d:'M21.5 2.5 q1.5 1.2 0 2.4',stroke:'#2B2A28','stroke-width':1,fill:'none'},side);
 const front=el('g',{opacity:0},head);
 el('ellipse',{cx:-4,cy:-6,rx:6,ry:3,fill:'#D9B49A',transform:'rotate(20 -4 -6)'},front);
 el('ellipse',{cx:20,cy:-6,rx:6,ry:3,fill:'#D9B49A',transform:'rotate(-20 20 -6)'},front);
 el('ellipse',{cx:8,cy:0,rx:9,ry:11,fill:'#F1E2D0'},front);
 el('circle',{cx:8,cy:-9,r:5,fill:W.f,stroke:W.s,'stroke-width':1},front);
 el('circle',{cx:4.5,cy:-1,r:1.5,fill:'#2B2A28'},front);el('circle',{cx:11.5,cy:-1,r:1.5,fill:'#2B2A28'},front);
 el('path',{d:'M8 4 v2 M8 6 l-2 1.5 M8 6 l2 1.5',stroke:'#2B2A28','stroke-width':1,fill:'none','stroke-linecap':'round'},front);
 const drop=el('path',{d:'M24 -14 q-3 4 0 6 q3 -2 0 -6',fill:'#9AD4F2'},front);
 return {head,side,front,drop};
}
const S=[
 {o:sheep(62,392,.72,1,false),ph:0},
 {o:sheep(148,350,1,1,false),ph:1600},
 {o:sheep(72,470,1,1,false),ph:800},
 {o:sheep(232,478,1,-1,false),ph:2400}
];
const B=sheep(230,398,1,-1,true);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;const t0=performance.now();
  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
function frame(){const t=reduce?0:performance.now()-t0;raf=0;
 S.forEach(s=>{const c=(t+s.ph)%4600;let a;if(c<1400)a=0;else if(c<1900)a=ease((c-1400)/500)*58;else if(c<4100)a=58;else a=58*(1-ease((c-4100)/500));
  const chew=(c>1900&&c<4100)?Math.sin(t/110)*1.2:0;s.o.head.setAttribute('transform',`rotate(${a}) translate(0 ${chew})`)});
 const c=t%6600;let mode='l';if(c<1300)mode='l';else if(c<1900)mode='r';else if(c<2300)mode='l';else if(c<2700)mode='r';else mode='f';
 B.side.setAttribute('opacity',mode==='f'?0:1);B.front.setAttribute('opacity',mode==='f'?1:0);
 B.side.setAttribute('transform',mode==='r'?'translate(26 0) scale(-1 1)':'');
 B.head.setAttribute('transform',mode==='f'?'translate(-6 -2)':'');
 B.drop.setAttribute('opacity',mode==='f'&&(t>>8)%4<3?1:0);
 if(!reduce&&landingEl)raf=requestAnimationFrame(frame)}
  frame();
  document.getElementById('lstart').onclick=()=>{A.start();leaveLanding();setupScreen();};
}

buildBg();
landingScreen();
})();
</script>
</body>
