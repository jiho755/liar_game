name: Build Play Store AAB

# 구글 플레이 스토어 제출용 빌드 (android.yml 의 디버그 APK 와는 별개)
#  - 자동 업데이트 로더 제거 + 로컬 폰트 (store/prepare.sh)
#  - 서명 시크릿(KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD)이 있으면 서명된 .aab,
#    없으면 서명 안 된 .aab 를 만들고 로그에 경고만 남긴다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (비우면 1.0.<run_number>)'
        required: false
        default: ''
      real_ads:
        description: '진짜 AdMob 전면 광고 ID 사용 (체크 안 하면 구글 테스트 광고. 태그(v*) 푸시는 항상 테스트 광고)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      APP_NAME: 성경 라이어
      APP_ID: com.jiho755.bibleliar
      TARGET_SDK: '36'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compute version
        id: ver
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          set -euo pipefail
          CODE="${{ github.run_number }}"
          NAME=""
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "${INPUT_VERSION:-}" ]]; then
            NAME="${INPUT_VERSION#v}"
          fi
          if [[ ! "$NAME" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            [[ -n "$NAME" ]] && echo "::warning::versionName '$NAME' 형식이 이상해서 기본값을 사용합니다"
            NAME="1.0.${CODE}"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME"

      - name: Choose AdMob interstitial ID
        id: ads
        env:
          REAL_ADS: ${{ github.event.inputs.real_ads }}
        run: |
          set -euo pipefail
          TEST_ID="ca-app-pub-3940256099942544/1033173712"
          REAL_ID="ca-app-pub-9944205919298185/5774072327"
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${REAL_ADS:-}" = "true" ]; then
            echo "id=$REAL_ID" >> "$GITHUB_OUTPUT"
            echo "::notice::AdMob 전면 광고: 진짜 광고 ID 사용 ($REAL_ID)"
          else
            echo "id=$TEST_ID" >> "$GITHUB_OUTPUT"
            echo "::notice::AdMob 전면 광고: 구글 테스트 광고 ID 사용 ($TEST_ID) - 스토어 제출용 진짜 광고는 real_ads 를 체크하고 수동 실행"
          fi

      - name: Prepare store www (loader 제거 + 로컬 폰트 + 광고 설정)
        env:
          ADMOB_INTERSTITIAL_ID: ${{ steps.ads.outputs.id }}
        run: bash store/prepare.sh

      - name: Generate Capacitor Android project
        run: |
          set -euo pipefail
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@^8 @capacitor/cli@^8 @capacitor/android@^8
          # AdMob 플러그인 (Capacitor 8.5+ 필요, 8.4.2 는 README 기준 Capacitor 8 대응). 스토어 빌드 전용.
          npm i @capacitor-community/admob@^8.4.2
          mkdir www && cp -r ../store/www/. www/
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npm i -D @capacitor/assets
          npx @capacitor/assets generate --android --assetPath ../assets
          npx cap sync android
          grep -q "capacitor-community-admob" android/capacitor.settings.gradle || { echo "::error::AdMob 플러그인이 android 프로젝트에 연결되지 않았습니다"; exit 1; }
          # kotlin 중복 클래스 충돌 회피 (android.yml 과 동일)
          printf "\ndependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')\n}\n" >> android/app/build.gradle
          cat capacitor.config.* || true

      - name: Inject AdMob app id + AD_ID permission into AndroidManifest
        working-directory: app/android
        env:
          ADMOB_APP_ID: ca-app-pub-9944205919298185~2722909717
        run: |
          set -euo pipefail
          python3 - "$ADMOB_APP_ID" <<'PY'
          import re, sys
          app_id = sys.argv[1]
          p = 'app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          meta = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="%s"/>' % app_id
          perm = '<uses-permission android:name="com.google.android.gms.permission.AD_ID"/>'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in s:
              m = re.search(r'<application\b[^>]*>', s)
              if not m or m.group(0).endswith('/>'):
                  sys.exit('<application> 태그를 찾지 못했습니다')
              s = s[:m.end()] + '\n        ' + meta + s[m.end():]
          if 'com.google.android.gms.permission.AD_ID' not in s:
              m = re.search(r'</application>', s)
              if not m:
                  sys.exit('</application> 태그를 찾지 못했습니다')
              s = s[:m.end()] + '\n\n    ' + perm + s[m.end():]
          open(p, 'w', encoding='utf-8').write(s)
          PY
          cat app/src/main/AndroidManifest.xml
          M=app/src/main/AndroidManifest.xml
          grep -qF 'android:name="com.google.android.gms.ads.APPLICATION_ID"' "$M" || { echo "::error::APPLICATION_ID meta-data 주입 실패" >&2; exit 1; }
          grep -qF "android:value=\"${ADMOB_APP_ID}\"" "$M" || { echo "::error::AdMob 앱 ID 값 확인 실패" >&2; exit 1; }
          grep -qF 'android:name="com.google.android.gms.permission.AD_ID"' "$M" || { echo "::error::AD_ID 권한 주입 실패" >&2; exit 1; }
          python3 -c "import xml.dom.minidom,sys; xml.dom.minidom.parse('$M')" || { echo "::error::AndroidManifest.xml 이 올바른 XML 이 아닙니다" >&2; exit 1; }

      - name: Set versionCode / versionName / targetSdk
        working-directory: app/android
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          echo "--- before ---"
          grep -nE "versionCode|versionName" app/build.gradle
          grep -nE "(min|compile|target)SdkVersion" variables.gradle
          sed -i -E "s/^([[:space:]]*)versionCode[[:space:]]+[0-9]+/\1versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i -E "s/^([[:space:]]*)versionName[[:space:]]+\"[^\"]*\"/\1versionName \"${VERSION_NAME}\"/" app/build.gradle
          sed -i -E "s/^([[:space:]]*)targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/\1targetSdkVersion = ${TARGET_SDK}/" variables.gradle
          # compileSdk 는 targetSdk 이상이어야 함
          CUR_COMPILE="$(grep -E "^[[:space:]]*compileSdkVersion" variables.gradle | grep -oE "[0-9]+" | head -1)"
          if [ "${CUR_COMPILE:-0}" -lt "${TARGET_SDK}" ]; then
            sed -i -E "s/^([[:space:]]*)compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/\1compileSdkVersion = ${TARGET_SDK}/" variables.gradle
          fi
          echo "--- after ---"
          grep -nE "versionCode|versionName" app/build.gradle
          grep -nE "(min|compile|target)SdkVersion" variables.gradle
          grep -qE "^[[:space:]]*versionCode ${VERSION_CODE}\$" app/build.gradle || { echo "versionCode 치환 실패" >&2; exit 1; }
          grep -qE "^[[:space:]]*versionName \"${VERSION_NAME}\"\$" app/build.gradle || { echo "versionName 치환 실패" >&2; exit 1; }
          grep -qE "^[[:space:]]*targetSdkVersion = ${TARGET_SDK}\$" variables.gradle || { echo "targetSdk 치환 실패" >&2; exit 1; }

      - name: Configure release signing (if secrets exist)
        id: sign
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            KS="$RUNNER_TEMP/upload.keystore"
            echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$KS"
            test -s "$KS" || { echo "::error::KEYSTORE_BASE64 디코딩 결과가 비어 있습니다"; exit 1; }
            echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
            # 비밀번호는 파일에 쓰지 않고, 빌드 때 환경변수에서 읽도록 Groovy 블록만 추가
            cat ../../store/signing.gradle >> app/build.gradle
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "서명 키스토어 준비 완료 -> 서명된 AAB 를 빌드합니다."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::서명 시크릿(KEYSTORE_BASE64/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD)이 없어 서명되지 않은(UNSIGNED) AAB 를 빌드합니다. 플레이 스토어에 올리려면 store/KEYSTORE.md 를 참고해 시크릿을 등록하세요."
          fi

      - name: Build release AAB
        working-directory: app/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon
          AAB="$(ls app/build/outputs/bundle/release/*.aab | head -1)"
          mkdir -p "$GITHUB_WORKSPACE/out"
          ADTAG=""
          if [ "${{ steps.ads.outputs.id }}" != "ca-app-pub-9944205919298185/5774072327" ]; then ADTAG="-TESTADS"; fi
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            OUT="$GITHUB_WORKSPACE/out/bible-liar-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}${ADTAG}-signed.aab"
          else
            OUT="$GITHUB_WORKSPACE/out/bible-liar-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}${ADTAG}-UNSIGNED.aab"
            echo "::warning::UNSIGNED AAB 입니다 (플레이 스토어 업로드 불가)."
          fi
          cp "$AAB" "$OUT"
          ls -l "$GITHUB_WORKSPACE/out"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "$GITHUB_WORKSPACE/out/mapping.txt"
          else
            echo "proguard mapping.txt 없음 (minifyEnabled false 이므로 정상)"
          fi

      - name: Verify AAB signature
        if: steps.sign.outputs.signed == 'true'
        run: |
          set -euo pipefail
          for f in out/*-signed.aab; do
            jarsigner -verify -strict "$f"
            keytool -printcert -jarfile "$f" | grep -E "Owner|SHA256" || true
          done

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: bible-liar-aab-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: out/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Upload proguard mapping
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}
          path: out/mapping.txt
          retention-days: 30
          if-no-files-found: ignore
